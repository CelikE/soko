name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.14.0

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.15.2"
          args: check

      - name: Validate CI test runner
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

  windows-smoke:
    name: Windows smoke
    timeout-minutes: 5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Verify worktree registration and PowerShell navigation
        shell: pwsh
        run: ./.github/scripts/windows-worktree-smoke.ps1

  race:
    name: Race and coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install Fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Test with race detection and coverage
        run: python .github/scripts/ci_test.py --race --coverprofile coverage.out --timings "${{ runner.temp }}/race-timings.jsonl"

      - name: Upload coverage and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-race-coverage
          path: |
            coverage.out
            ${{ runner.temp }}/race-timings.jsonl
          retention-days: 14
