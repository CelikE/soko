name: Cross-platform race

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: Race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install Fish on macOS
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Add Git for Windows Unix tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Join-Path $env:ProgramFiles 'Git/usr/bin' >> $env:GITHUB_PATH

      - name: Test with race detection
        run: python .github/scripts/ci_test.py --race --timings "${{ runner.temp }}/race-timings.jsonl"

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: race-timings-${{ matrix.os }}
          path: ${{ runner.temp }}/race-timings.jsonl
          retention-days: 14
