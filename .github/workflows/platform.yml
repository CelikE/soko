name: Full platform tests

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: full-platform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    uses: ./.github/workflows/distribution-audit.yml

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install completion prerequisites on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh bash-completion

      - name: Install completion prerequisites on macOS
        if: runner.os == 'macOS'
        run: brew install fish bash-completion

      - name: Add Git for Windows Unix tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Join-Path $env:ProgramFiles 'Git/usr/bin' >> $env:GITHUB_PATH

      - name: Test
        run: python .github/scripts/ci_test.py --timings "${{ runner.temp }}/test-timings.jsonl"

      - name: Record audit source and native tools
        shell: pwsh
        run: |
          git rev-parse HEAD
          git --version
          go version
          $PSVersionTable | Format-List

      - name: Verify PowerShell audit prerequisites and regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Get-Command pwsh
          go test ./internal/cli -run '^TestIntegration_PowerShell(ExactNavigation|Completion)$' -count=1 -v

      - name: Verify native filesystem boundaries
        run: go test ./internal/config -run '^(TestPathWithinRoot|TestShouldDiscover)$' -count=1 -v

      - name: Verify Unix TAB completion prerequisites
        if: runner.os != 'Windows'
        run: |
          command -v bash zsh fish
          test -f /usr/share/bash-completion/bash_completion || test -f "$(brew --prefix)/etc/bash_completion"
          go test ./internal/cli -run '^TestTerminalAuditShellCompletion$' -count=1 -v

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-${{ matrix.os }}
          path: ${{ runner.temp }}/test-timings.jsonl
          retention-days: 14
